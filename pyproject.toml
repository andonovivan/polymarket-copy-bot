[project]
name = "polymarket-bot"
version = "0.2.0"
description = "Auto-bettor on Polymarket's BTC up/down 5-minute binary markets."
requires-python = ">=3.11"
dependencies = [
    "py-clob-client>=0.17.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "structlog>=24.0.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
polymarket-bot = "polymarket_bot.main:main"

[tool.setuptools.package-data]
polymarket_bot = ["dashboard/static/*", "dashboard/static/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
